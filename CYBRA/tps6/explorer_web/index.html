<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>TPS6 Explorer</title>
</head>
<body>
  <h1>TPS6 Native Chain Explorer</h1>

  <button onclick="loadStatus()">Status</button>
  <button onclick="loadBalance()">Balance</button>
  <button onclick="loadChain()">Chain</button>
  <button onclick="loadProof()">Proof</button>

  <pre id="out">Loading...</pre>

  <script>
    async function show(path) {
      const res = await fetch("http://127.0.0.1:8066/" + path);
      const data = await res.json();
      document.getElementById("out").textContent = JSON.stringify(data, null, 2);
    }

    function loadStatus(){ show("status"); }
    function loadBalance(){ show("balance"); }
    function loadChain(){ show("chain"); }
    function loadProof(){ show("proof"); }

    loadStatus();
  </script>
</body>
</html>
